<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Punto motor-Agencia de autos</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!--
      Need a visual blank slate?
      Remove all code in `styles.css`!
    -->
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header>
<div id="logo">
  <img src="img/Logo.png" alt="logo">
</div>

    </header>
    <nav>
        <a href="index.html" >Inicio</a>
        <a href="marcas.html" >Marcas</a>
        <a href="autos.html">Autos</a>
        <a href="camionetas.html" >Camionetas</a>
        <a href="nosotros.html" class="activo">Nosotros</a>
      </nav>
      <main>
        <h2>Encuesta o datos de las entradas</h2>
        <p>Ingrese sus datos para realizar la reserva de la entrada</p>
        <section>
          <div id="formulario">
            <h2>Tus datos</h2>
            <form action="#">
              <label for="formnombre">Nombre</label>
              <input type="text" name="formnombre" id="formnombre" maxlength="30" minlength="3" required
                placeholder="ingrese su nombre">
              <label for="formapellido">Apellido</label>
              <input type="text" name="formapellido" id="formapellido" maxlength="30" minlength="3" required
                placeholder="ingrese su apellido">
              <input id="formedad" required type="number" placeholder="Ingrese su edad">
              <input id="formclave" required type="password" placeholder="Ingrese la palabra secreta">
              <input id="formcorreo" type="email" placeholder="correopp@dom.com">
              <input type="radio" id="formf" name="formsexo" value="Femenino">
              <label for="fem">Femenino</label>
              <input type="radio" id="formm" name="formsexo" value="Masculino">
              <label for="mas">Masculino</label>
              <input type="radio" id="formn" name="formsexo" value="Nodecirlo">
              <label for="moinf">Prefiero no decirlo</label> <br> <br>
              <label for="ubicacion">Seleccione una ubicación</label><br>
              <select name="ubicacion" id="formubi">
                <option value="plateaa">Platea Alta</option>
                <option value="plateam">Platea Media</option>
                <option value="plateab">Platea Baja</option>
                <option value="popular">Popular</option>
                <option value="palco">Palco</option>
              </select>
              <textarea name="areatexto" id="formtext" cols="30" rows="5"></textarea>
    
    
              <input type="submit">
            </form>
          </div>
        </section>
    
      </main>
  
  </body>
</html>
