<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Punto motor-Agencia de autos</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!--
      Need a visual blank slate?
      Remove all code in `styles.css`!
    -->
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header>
<div id="logo">
  <img src="img/Logo.png" alt="logo">
</div>

    </header>
    <nav>
        <a href="index.html" >Inicio</a>
        <a href="marcas.html" >Marcas</a>
        <a href="autos.html">Autos</a>
        <a href="camionetas.html" >Camionetas</a>
        <a href="nosotros.html" class="activo">Nosotros</a>
      </nav>
      <main>
        <h2>Encuesta o datos de las entradas</h2>
        <p>Ingrese sus datos para realizar la reserva de la entrada</p>
        <section>
          <div id="formulario">
            <h2>Tus datos</h2>
            <form action="#">
              <label for="formnombre">Nombre</label>
              <input type="text" name="formnombre" id="formnombre" maxlength="30" minlength="3" required
                placeholder="ingrese su nombre">
              <label for="formapellido">Apellido</label>
              <input type="text" name="formapellido" id="formapellido" maxlength="30" minlength="3" required
                placeholder="ingrese su apellido">
              <input id="formdni" required type="identificacion" placeholder="Ingrese su DNI">
              <input id="formcorreo" type="email" placeholder="correopp@dom.com">
              <label for="vehiculo">Seleccione el tipo de vehículo</label><br>
              <select name="vehiculo" id="formvehiculo">
                <option value="vehiculo">Auto</option>
                <option value="vehiculos">Camioneta</option>

                <label for="marca">Seleccione el tipo de marca</label><br>
              <select name="marca" id="formvehiculo">
                <option value="marcaa">Toyota</option>
                <option value="marcab">Honda</option>
                <option value="marcac">Volkswagen</option>
                <option value="marcasd">Mercedes</option>
                <option value="marcae">BMW</option>
                <option value="marcasf">Audi</option>
                <option value="marcasg">Peugeot</option>
                
              </select>
              
    
    
              <input type="submit">
            </form>
          </div>
        </section>
    
      </main>
  
  </body>
</html>
